name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # navi shells out to ripgrep for its content-search backend, and `info`
      # reports which backends a machine actually has. Without it the runner
      # reports `rg: false` — correctly — and the test that asserts the backend
      # is present fails, which is what has kept main red.
      - name: Install search backends
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
